<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Softode | Own Your Digital Real Estate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Plus Jakarta Sans', 'sans-serif'], }, colors: { primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' }, accent: { 500: '#8b5cf6' } } }
            }
        }
    </script>
    <style>
        .text-gradient { background: linear-gradient(135deg, #2563eb 0%, #8b5cf6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .bg-gradient-tech { background: linear-gradient(135deg, #2563eb 0%, #8b5cf6 100%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">
    
    <nav class="fixed w-full z-50 bg-white/70 backdrop-blur-md border-b border-slate-200/50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="font-heading font-extrabold text-2xl tracking-tight flex items-center gap-2 text-slate-900">
                <div class="w-8 h-8 rounded-lg bg-gradient-tech flex items-center justify-center text-white"><i class="ph-bold ph-lightning"></i></div>Soft<span class="text-primary-600">ode</span>
            </a>
            <a href="#products" class="inline-flex items-center justify-center bg-slate-900 text-white px-6 py-2.5 rounded-xl font-medium text-sm hover:bg-primary-600 transition-all">Shop Now</a>
        </div>
    </nav>

    <section id="hero" class="pt-32 pb-20 md:pt-40 md:pb-32 px-6">
        <div class="max-w-7xl mx-auto text-center">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-primary-50 border border-primary-100 text-primary-700 text-sm font-semibold mb-6">Managed Hosting Included</div>
            <h1 class="font-heading text-5xl md:text-6xl lg:text-7xl font-extrabold tracking-tight mb-6 text-slate-900">Launch Your Digital <br class="hidden lg:block"><span class="text-gradient">Empire Instantly.</span></h1>
            <p class="text-lg md:text-xl text-slate-600 mb-10 max-w-xl mx-auto leading-relaxed">Premium, production-ready website templates, admin panels, and custom software. Fully managed for your business.</p>
        </div>
    </section>

    <section id="products" class="py-24 bg-white">
        <div class="max-w-7xl mx-auto px-6">
            <div class="text-center mb-16"><h2 class="font-heading text-4xl md:text-5xl font-bold mb-4 text-slate-900">Permanent Websites</h2></div>
            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div class="col-span-full text-center text-slate-400 py-10"><i class="ph ph-spinner animate-spin text-3xl"></i><br>Loading Catalog...</div>
            </div>
        </div>
    </section>

    <script>
        const SUPABASE_URL = 'https://vzznqlxiolikyrzabgbb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_1zHkc8FfhIZs41L3xuNMNQ_l9L6Ph8G';
        const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };

        async function loadCatalog() {
            const grid = document.getElementById('product-grid');
            try {
                let products = [];
                // Failsafe fetch logic to prevent loading crash!
                const res = await fetch(`${SUPABASE_URL}/rest/v1/catalog?select=*&order=sort_order.desc,id.desc`, { headers });
                
                if (!res.ok) {
                    console.warn("Custom columns missing, falling back to basic data.");
                    const fallback = await fetch(`${SUPABASE_URL}/rest/v1/catalog?select=*`, { headers });
                    if(fallback.ok) products = await fallback.json();
                } else {
                    products = await res.json();
                }
                
                grid.innerHTML = ''; 

                if (!products || products.length === 0) {
                    grid.innerHTML = '<p class="col-span-full text-center text-slate-500 py-10">Storefront is empty.</p>';
                    return;
                }

                // Make the entire card a clickable <a> tag to guarantee UX works!
                products.forEach(p => {
                    grid.innerHTML += `
                        <a href="product.html?id=${p.id}" class="block bg-white rounded-[2rem] border border-slate-100 shadow-sm flex flex-col overflow-hidden hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 group cursor-pointer h-full relative z-10">
                            <div class="h-56 bg-slate-100 overflow-hidden relative">
                                <img src="${p.image || 'https://placehold.co/600x400'}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                            </div>
                            <div class="p-8 flex flex-col flex-grow">
                                <span class="text-[10px] font-black uppercase tracking-wider text-primary-600 bg-primary-50 px-2 py-1 rounded-md inline-block self-start mb-3">${p.category || 'Template'}</span>
                                <h3 class="font-heading text-xl font-bold mb-2 text-slate-900">${p.name}</h3>
                                <p class="text-slate-500 text-sm mb-6 line-clamp-2">${p.description || ''}</p>
                                <div class="mb-6"><span class="text-3xl font-extrabold text-slate-900">$${p.price}</span></div>
                                <div class="mt-auto">
                                    <div class="w-full py-3.5 bg-slate-900 text-white rounded-xl font-bold group-hover:bg-primary-600 transition-all shadow-md flex items-center justify-center gap-2">View Details <i class="ph-bold ph-arrow-right"></i></div>
                                </div>
                            </div>
                        </a>`;
                });
            } catch (err) { 
                grid.innerHTML = '<p class="col-span-full text-center text-red-500 py-10">Error connecting to database. Please refresh.</p>';
            }
        }
        
        loadCatalog();
    </script>
</body>
</html>
