<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Softode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        heading: ['Plus Jakarta Sans', 'sans-serif'], 
                    },
                    colors: { 
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' } 
                    }
                }
            }
        }
    </script>
    <style>
        .active-thumb { border: 2px solid #2563eb; opacity: 1; }
        .inactive-thumb { border: 2px solid transparent; opacity: 0.6; }
        .inactive-thumb:hover { opacity: 1; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a class="font-heading font-extrabold text-2xl tracking-tight flex items-center gap-2 text-slate-900" href="/">
                <div class="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center text-white">
                    <i class="ph-bold ph-lightning"></i>
                </div>
                Soft<span class="text-primary-600">ode</span>
            </a>
            <a class="text-sm font-bold text-slate-500 hover:text-slate-900 flex items-center gap-1" href="/">
                <i class="ph-bold ph-arrow-left"></i> Back to Store
            </a>
        </div>
    </nav>

    <!-- Loading State -->
    <div id="loading-state" class="flex-grow flex items-center justify-center py-32">
        <div class="text-center text-slate-400">
            <i class="ph ph-spinner animate-spin text-4xl mb-2"></i>
            <p>Loading product...</p>
        </div>
    </div>

    <!-- Product Layout -->
    <main id="product-layout" class="flex-grow max-w-7xl mx-auto px-6 py-12 w-full hidden">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16 items-start">
            
            <!-- LEFT: Image Slider -->
            <div class="w-full space-y-4 sticky top-6">
                <div class="w-full aspect-[4/3] bg-slate-100 rounded-3xl overflow-hidden border border-slate-200 shadow-sm relative">
                    <img id="main-image" src="" alt="Product" class="w-full h-full object-cover transition-opacity duration-300 absolute inset-0 z-10">
                    <iframe id="main-video" src="" class="w-full h-full absolute inset-0 z-20 hidden" frameborder="0" allowfullscreen></iframe>
                </div>
                <div id="thumbnail-container" class="flex gap-4 overflow-x-auto pb-2 hide-scrollbar"></div>
            </div>

            <!-- RIGHT: Product Details -->
            <div class="flex flex-col">
                <span id="prod-category" class="text-xs font-black uppercase tracking-wider text-primary-600 bg-primary-50 px-3 py-1.5 rounded-lg inline-block self-start mb-4">Template</span>
                <h1 id="prod-title" class="font-heading text-4xl md:text-5xl font-extrabold text-slate-900 mb-4 leading-tight">...</h1>
                <p id="prod-short-desc" class="text-lg text-slate-500 mb-8 leading-relaxed"></p>

                <div class="p-6 bg-white rounded-3xl border border-slate-200 shadow-sm mb-10">
                    <div class="flex items-end gap-2 mb-2">
                        <span id="prod-price" class="text-5xl font-black text-slate-900">$0</span>
                        <span class="text-slate-500 font-medium mb-1">/ one-time payment</span>
                    </div>
                    <p class="text-sm text-green-600 font-bold flex items-center gap-1 mb-6">
                        <i class="ph-fill ph-check-circle"></i> Managed Hosting Included
                    </p>
                    <button id="checkout-btn" class="w-full py-4 bg-primary-600 text-white rounded-xl font-bold text-lg hover:bg-primary-700 transition-all shadow-lg flex items-center justify-center gap-2">
                        Proceed to Checkout <i class="ph-bold ph-lock-key"></i>
                    </button>
                    <div id="demo-container" class="mt-4 hidden">
                        <a id="demo-link" href="#" target="_blank" class="w-full py-3 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition-all text-sm flex items-center justify-center gap-2">
                            View Live Demo <i class="ph-bold ph-monitor-play"></i>
                        </a>
                    </div>
                </div>

                <div>
                    <h3 class="font-heading text-2xl font-bold text-slate-900 mb-4 border-b border-slate-100 pb-2">Product Overview</h3>
                    <div id="prod-full-desc" class="prose prose-slate max-w-none text-slate-600 leading-loose whitespace-pre-line"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 mt-20 pt-8 pb-8">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-sm text-slate-400 font-medium">© 2026 Softode. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://vzznqlxiolikyrzabgbb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_1zHkc8FfhIZs41L3xuNMNQ_l9L6Ph8G';
        const headers = { 
            'apikey': SUPABASE_KEY, 
            'Authorization': 'Bearer ' + SUPABASE_KEY, 
            'Content-Type': 'application/json' 
        };

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        let currentImageArray = [];

        async function fetchProductDetails() {
            if(!productId) { window.location.href = 'index.html'; return; }
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/catalog?id=eq.${productId}&select=*`, { headers });
                const data = await res.json();
                if(!data || data.length === 0) { throw new Error("Product not found"); }
                renderProduct(data[0]);
            } catch (err) {
                document.getElementById('loading-state').innerHTML = `<div class="text-center text-red-500"><p class="font-bold text-xl mb-2">Oops!</p><p>Product not found.</p></div>`;
            }
        }

        function renderProduct(p) {
            document.title = `${p.name} | Softode`;
            document.getElementById('prod-category').innerText = p.category || 'Template';
            document.getElementById('prod-title').innerText = p.name;
            document.getElementById('prod-short-desc').innerText = p.description || '';
            document.getElementById('prod-price').innerText = `$${p.price}`;
            document.getElementById('prod-full-desc').innerText = p.full_description || 'No detailed overview provided.';
            
            if(p.supplier) {
                document.getElementById('demo-container').classList.remove('hidden');
                document.getElementById('demo-link').href = p.supplier.split(',')[0].trim();
            }

            document.getElementById('checkout-btn').onclick = () => {
                window.location.href = `checkout.html?id=${p.id}`;
            };

            currentImageArray = [p.image || 'https://placehold.co/800x600'];
            if(p.image_gallery && Array.isArray(p.image_gallery)) {
                currentImageArray = currentImageArray.concat(p.image_gallery);
            }

            const thumbContainer = document.getElementById('thumbnail-container');
            thumbContainer.innerHTML = '';
            currentImageArray.forEach((mediaUrl, index) => {
                const ytId = getYouTubeId(mediaUrl);
                const thumbSrc = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : mediaUrl;
                thumbContainer.innerHTML += `
                    <button onclick="changeMainImage(${index})" id="thumb-${index}" class="relative w-24 h-24 shrink-0 rounded-xl overflow-hidden bg-slate-100 transition-all ${index === 0 ? 'active-thumb' : 'inactive-thumb'}">
                        <img src="${thumbSrc}" class="w-full h-full object-cover pointer-events-none">
                    </button>`;
            });

            changeMainImage(0);
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('product-layout').classList.remove('hidden');
        }

        function getYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function changeMainImage(index) {
            const mainImgEl = document.getElementById('main-image');
            const mainVidEl = document.getElementById('main-video');
            const mediaUrl = currentImageArray[index];
            const ytId = getYouTubeId(mediaUrl);
            
            if(ytId) {
                mainImgEl.classList.add('hidden');
                mainVidEl.src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
                mainVidEl.classList.remove('hidden');
            } else {
                mainVidEl.classList.add('hidden');
                mainVidEl.src = "";
                mainImgEl.src = mediaUrl;
                mainImgEl.classList.remove('hidden');
            }

            currentImageArray.forEach((_, i) => {
                const thumbEl = document.getElementById(`thumb-${i}`);
                if(thumbEl) {
                    thumbEl.classList.toggle('active-thumb', i === index);
                    thumbEl.classList.toggle('inactive-thumb', i !== index);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', fetchProductDetails);
    </script>
</body>
</html>
